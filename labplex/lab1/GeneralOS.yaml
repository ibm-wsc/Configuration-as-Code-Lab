boot_definitions:
  load_definitions:
    symbol_files:
      symbol_file_suffix_list:
        - Z2
        - SS
      display_symbol_files_on_console: true
    queue_area_reserved:
      system_queue_area:
        amount: 256
        units: K
      extended_system_queue_area:
        amount: 512
        units: K
    io_definitions:
      io_definition_suffix: "09"
      high_level_qualifier: ATSPLEX
      os_configuration_identifier: MVS1
      eligible_device_table: "00"
    nucleus_number: 1
    nucleus_list_definitions:
      nucleus_file_suffix: "00"
    registry_mvs_file_list:
      - file_name: SYS1.SITE.PARMLIB
      - file_name: SYS1.PARMLIB
      - file_name: SYS1.IBM.PARMLIB
    master_catalog_parameters:
      disk_name: ATSCAT
      sys1_conversion: false
      alias_name_level: 2
      catalog_address_space_service_task_lower_limit: 3C
      master_catalog_name: CATALOG.ATSPLEX.MASTER
    ieasysxx_registry_suffix:
      ieasysxx_registry_suffix_list:
        - Z2
      display_ieasysxx_on_console: true
    sysplex_name: ATSPLEX
  system_parameter_definitions:
    registry_suffixes:
      product_enablement_policy_suffixes:
        - "00"
        - Z2
      resource_access_control_facility_suffixes:
        - "00"
      global_resource_config_suffix: "00"
      global_resource_name_list_suffixes:
        - "00"
      supervisor_call_definitions_suffixes:
        - "00"
      fix_suffixes:
        suffix:
          - "00"
      unix_definitions_suffixes:
        - Z2
      allocation_suffixes:
        - "00"
      system_management_facilities_suffix: "00"
      console_suffixes:
        suffix:
          - "00"
      subsystem_initialization_suffixes:
        - "00"
      io_susystem_configuration_suffix: "00"
      link_pack_area_list_suffixes:
        suffix:
          - Z2
        display_contents: true
      program_properties_and_trace_abend_information_suffixes:
        suffix:
          - "00"
      clock_suffixes:
        suffix:
          - Z2
      couple_suffix: "00"
      authorized_program_definitions_suffixes:
        - A2
        - L2
        - EX
      master_jcl_suffix:
        suffix: Z2
        display_contents: true
      integrated_cryptographic_services_facility_suffix: "00"
      volume_attributes_list_suffixes:
        - "00"
      device_support_format_suffixes:
        - "00"
      storage_management_subsystem_suffix: "00"
    additional_entries:
      - CMD=(00
      - L)
      - DUMP=(DASD
      - 00-02
      - L)
      - ILMMODE=NONE
      - LFAREA=(1M=20%
      - 2G=40%)
    system_parms:
      common_service_area_sizes:
        common_service_area_size:
          amount: 1500
          unit: K
        extended_common_service_area_size:
          amount: 300
          unit: M
      load_lpa_from_lpalst: true
      how_to_join_global_resource_serialization: STAR
      integrated_cryptographic_facility_procedure: ICSF
      job_entry_subsystem_output_class_for_logs: L
      job_entry_subsystem_log_limit: 50000
      log_recording_medium: ATS1.LOGREC
      maximum_number_of_concurrent_started_tasks_per_user: 500
      number_of_linkage_indexes: 250
      page_mvs_files:
        file_name:
          - ATS1.PAGE.PLPA
          - ATS1.PAGE.CSA
          - ATS1.PAGE.LOCAL1
          - ATS1.PAGE.LOCAL2
        display_on_the_console: true
      sysplex_configuration: MULTISYSTEM
      maximum_amount_of_real_storage: 0
      reduced_error_recovery: YES
      storage_reconfiguration_amount: 0
      number_of_adress_space_vector_table_entries_reserved_for_replace: 200
      system_queue_area_sizes:
        below_16M:
          amount: 6
        above_16M:
          amount: 256
      virtual_io_mvs_filename: ATS1.STGINDEX
